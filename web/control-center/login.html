<!doctype html>
<!-- Control Center - Sign-in page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Agentra</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script type="module" src="../assets/js/pages/control-center/login.js"></script>
</head>
<body>
  <main class="center-screen">
    <div class="card login-card">
      <div>
        <div class="brand">Agentra</div>
        <p class="muted small">A Company Runs by Agents</p>
      </div>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="alert alert-error" role="alert" hidden></div>
        <button class="button" type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
