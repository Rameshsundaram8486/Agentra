# Permissions per role. Project roles apply only within the project the membership is for.
# Platform permissions (founder / admin, and the system account) apply to every project.
# Workflow state changes are authorised per transition in config/workflows/lifecycles/, and approvals and
# decision outcomes by config/policies/approval_matrix.yaml, not here.
# agent.run starts an agent task (a paid model call); agent_run.view shows runs, their model, cost and findings.
# change.raise raises a change request against an approved baseline; who decides one is in approval_matrix.yaml.
# report.generate makes a new report version; report.view sees every report type, report.view_customer only the
#   types config/policies/report_visibility.yaml marks customer_visible.
# incident.manage resolves an incident with a root-cause analysis; incident.close closes it once verified, and
#   not by the person who resolved it (config/policies/incident_rules.yaml).
version: 1

platform_admin:
  - project.create
  - project.view
  - audit.view
  - audit.verify
  - user.manage
  - artifact.view
  - decision.view
  - agent_run.view
  - report.view
  - incident.view

roles:
  owner: [project.view, project.manage_members, audit.view, artifact.view, artifact.author, decision.view, decision.raise, agent.run, agent_run.view, change.raise, report.generate, report.view, incident.view, incident.manage, incident.close]
  project_manager: [project.view, audit.view, artifact.view, artifact.author, decision.view, decision.raise, agent.run, agent_run.view, change.raise, report.generate, report.view, incident.view, incident.manage]
  reviewer: [project.view, audit.view, artifact.view, decision.view, agent_run.view, report.view, incident.view, incident.close]
  # Customer visibility is narrowed to customer-facing artifacts when the Customer Portal is built (Phase 11).
  customer_approver: [project.view, artifact.view, report.view_customer]
  agent: [project.view, artifact.view, artifact.author, decision.view, decision.raise]
