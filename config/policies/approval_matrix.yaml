# Which decisions need which human role; mandatory approval gates.
#
# artifact_types: every artifact has one of these types. approver_roles lists the project roles that may
#   approve, reject or request changes on a version. independent_review: true means nobody who authored
#   any version of the artifact may approve it (see separation_of_duties.yaml).
# Which approvals a phase needs before it can complete is set in each phase file (exit.required_approvals).
# decisions: who may record the outcome of a decision request raised by an agent or a person.
#
# baselines: artifact types under change control. Once the current version is approved, nobody can add a
#   version directly; only an approved change request can (applied by the requirements service).
# change_requests.required_roles: a change request needs one approval per listed role, each from a
#   different person, and never from the person who raised it. Any rejection rejects it.
#
# Agents never approve or decide. That is enforced in code; a role list containing "agent" fails startup.
# Phase-specific types are refined as each phase increment is built.
version: 1

artifact_types:
  project_brief:
    title: Project brief
    approver_roles: [reviewer, owner]
    independent_review: true
  source_document:
    title: Source document
    approver_roles: [reviewer, owner]
    independent_review: true
  requirements_baseline:
    title: Requirements baseline
    approver_roles: [reviewer, owner]
    independent_review: true
  design_baseline:
    title: Design baseline
    approver_roles: [reviewer, owner]
    independent_review: true
  implementation_report:
    title: Implementation report
    approver_roles: [reviewer, owner]
    independent_review: true
  qa_completion_report:
    title: QA completion report
    approver_roles: [reviewer, owner]
    independent_review: true
  uat_signoff_record:
    title: UAT sign-off record
    approver_roles: [customer_approver]
    independent_review: true
  working_document:
    title: Working document
    approver_roles: [reviewer, owner, project_manager]
    independent_review: true

decisions:
  decider_roles: [owner, project_manager]

baselines: [requirements_baseline, design_baseline]

change_requests:
  required_roles: [owner, customer_approver]
