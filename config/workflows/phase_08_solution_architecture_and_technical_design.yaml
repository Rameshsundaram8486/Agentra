# Phase 8 - Solution Architecture and Technical Design: states, tasks, entry/exit gates, required approvals. Primary agent: solution_architect.
# The agent tasks behind these are in config/agents/solution_architect/agent.yaml (workflow_task).
# design_coverage: the current design is not stale and covers every confirmed requirement, or documents why not.
# design_reviews: the current design has an approved security review and a feasibility review of that exact
#   version, with no high-severity security gap and nothing rated not feasible (also checked when the design
#   is approved). The review tasks close only once the design is approved, so a redraft cannot skip a review.
# backlog_current: an approved implementation backlog planning the current approved design version.
# Design change requests arrive with Increment 4d.
key: phase_08_solution_architecture_and_technical_design
version: 1
phase: 8
name: Solution Architecture and Technical Design
primary_agent: solution_architect
lifecycle: standard_phase
task_lifecycle: standard_task
entry:
  requires_completed_phases: [7]
exit:
  required_approvals: [design_baseline]
  checks: [design_coverage, design_reviews, backlog_current]
tasks:
  - key: compare_options
    title: Compare solution options
    agent: solution_architect
    requires_answered_questions: true
  - key: draft_design
    title: Draft and review the design
    agent: solution_architect
    depends_on: [compare_options]
    required_approvals: [design_baseline]
  - key: review_security
    title: Security review of the design
    agent: security_reviewer
    depends_on: [compare_options]
    required_approvals: [security_review, design_baseline]
  - key: review_feasibility
    title: Feasibility review of the design
    agent: developer
    depends_on: [compare_options]
    required_approvals: [design_baseline]
  - key: plan_backlog
    title: Plan the implementation backlog
    agent: developer
    depends_on: [draft_design]
    required_approvals: [implementation_backlog]
