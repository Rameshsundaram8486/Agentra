# Business Analyst Agent: requirements, acceptance criteria, traceability (Phase 7; consulted 8, 10, 11).
# Loaded by app/harness/registry.py; the code for each task is in app/agents/business_analyst/.
# Model, effort and token limits are in config/models.yaml. Agents draft and ask; people decide and approve.
version: 1
key: business_analyst
name: Business Analyst Agent
mission: >
  Turn project inputs into clear, testable requirements, and ask the people on the project wherever the
  inputs are missing, ambiguous or need a decision.
phases: [7]
autonomy: supervised   # every output is a proposal or a question for a person
risk_class: low        # reads project documents and raises decisions; no external actions

tasks:
  clarify_brief:
    title: Ask about the project brief
    description: >
      Reads a project brief and asks the project team to decide the technology stack and delivery approach,
      and to answer questions about gaps or ambiguities in the brief.
    phase: 7
    workflow_task: clarify_brief
    phase_states: [in_progress, waiting_for_input]
    input_artifact_types: [project_brief]
    prompt: prompts/clarify_brief.v1.md
    output_schema: schemas/clarify_brief.v1.json
    max_attempts: 2

  draft_requirements:
    title: Draft the requirements
    description: >
      Drafts objectives, stakeholders, functional and non-functional requirements, user stories with
      acceptance criteria, business rules, assumptions, dependencies and open questions from the brief,
      the source documents and the team's answers, each labelled and linked to its sources.
    phase: 7
    workflow_task: draft_requirements
    phase_states: [in_progress, waiting_for_input]
    input_artifact_types: [project_brief]
    context_artifact_types: [source_document]
    context_decisions_from: [clarify_brief, draft_requirements]  # including answers to its own open questions
    prompt: prompts/draft_requirements.v1.md
    output_schema: schemas/draft_requirements.v1.json
    max_attempts: 2
