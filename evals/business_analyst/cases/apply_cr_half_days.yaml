change_request:
  title: Half-day leave
  reason: HR confirmed that staff often take half days.
  change: Change REQ-F-001 so employees can request leave in half days as well as full days.
  impact: Small; one more option in the request form and the balance calculation.
  affected_item_ids: [REQ-F-001]
expect:
  unchanged_count: true
  changed_items_contain:
    REQ-F-001: [half]
